# Render blueprint, free tier: the API as a Docker web service plus Render's free Postgres for both databases.
#
# In the Render dashboard: New > Blueprint > pick this repository > Apply. It asks only for the model keys.
# The website lives on Vercel (readme.md, "Deploying").
#
# Free-tier facts this file is built around:
# - No disk on a free web service, so SQLite would be wiped on every restart. Both DATABASE_URL and
#   WEB_AUTH_DATABASE_URL therefore point at the Postgres below; the account tables use their own schema.
# - The free Postgres expires 30 days after creation. For a permanent free database create one on Neon
#   (neon.tech) and set both URLs to its connection string in the service's environment.
# - A free web service sleeps after 15 minutes without traffic and takes about a minute to wake; the
#   website shows "Waking up the server" while it does.
services:
  - type: web
    name: voicematics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/live
    numInstances: 1
    envVars:
      - key: REQUIRE_ACCOUNT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: voicematics-db
          property: connectionString
      - key: WEB_AUTH_DATABASE_URL
        fromDatabase:
          name: voicematics-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://voicematics.vercel.app", "https://voicematics-team-crimson2.vercel.app"]'
      - key: CORS_ORIGIN_REGEX
        value: app://[^/\s]*
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "720"
      - key: INSTALLER_DOWNLOAD_URL
        value: https://github.com/Dx-Alz-xD/Voicematics/releases/latest/download/Voicematics-Setup.exe
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: voicematics-db
    plan: free
    region: oregon
    databaseName: voicematics
    user: voicematics
